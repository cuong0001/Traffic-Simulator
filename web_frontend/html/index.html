<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Map Viewer</title>
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/stats_panel.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Canvas Area -->
        <div class="canvas-container">
            <canvas id="simCanvas"></canvas>

            <div id="loading-alert" class="global-alert hidden">
                Loading Map Data...
                <br>
            </div>

            <div id="map-loader" class="map-loader-panel">
                <h2>Traffic Simulator</h2>
                <p class="map-loader-hint">Choose a map to display</p>
                <button id="btn-default-map" class="map-loader-btn">Load Default Map</button>
                <button id="btn-custom-map" class="map-loader-btn secondary">Load Custom Map</button>
                <p class="map-loader-note">Custom map: select the 3 CSV files (nodes, roads, buildings) together</p>
                <input type="file" id="csv-file-input" accept=".csv,text/csv" multiple hidden>
                <p id="loader-error" class="loader-error hidden"></p>
            </div>

            <button id="btn-open-loader" class="corner-btn hidden">Load Map</button>
        </div>
    </div>
    
    <script src="../js/app.js"></script>
</body>
</html>
