<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Map Viewer</title>
    <link rel="stylesheet" href="../css/side_bar.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/canvas.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/event_log.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="menu-container"></div> <script>
        // Hàm nạp file menu vào thẻ div trên
        fetch('menu/menu.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-container').innerHTML = data;
            });
    </script>  
    
    <div id="event-log"></div> <script>
        fetch('event_log/event_log.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('event-log').innerHTML = data;
            });
    </script>  
    
    <div class="viewport">
        <canvas id="mainCanvas"></canvas>
    </div>
    
    <script type="module" src="../js/app.js"></script>
</body>
</html>
